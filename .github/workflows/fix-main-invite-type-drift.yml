name: Repair Main Invitation Type Drift

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-main-invite-type-drift.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Repair stale component field names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/Home.tsx')
          s = p.read_text()
          old1 = 'primaryName={message.name}'
          new1 = 'primaryName={message.authorName}'
          old2 = '<AccountSection accounts={accounts} onCopy={copyAccount} />'
          new2 = '<AccountSection accounts={accounts} copyAccount={copyAccount} />'
          if old1 not in s:
              raise SystemExit('expected guestbook field marker not found')
          if old2 not in s:
              raise SystemExit('expected AccountSection prop marker not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'invite-ci-bot'
          git config user.email 'invite-ci-bot@users.noreply.github.com'
          git add client/src/pages/Home.tsx
          git commit -m 'fix(invite): align guestbook and account component types'
          git push origin HEAD:main
