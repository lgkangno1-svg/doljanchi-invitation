name: Deploy Invite2 to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'invite2/**'
      - '.github/workflows/deploy-invite2-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-invite2-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_PRIMARY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT_ALT: ${{ secrets.CF_ACCOUNT_ID }}
      CF_PROJECT_SECRET: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout latest invite2 source
        uses: actions/checkout@v4

      - name: Resolve Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          token="${CF_TOKEN_PRIMARY:-${CF_TOKEN_ALT:-}}"
          account="${CF_ACCOUNT_PRIMARY:-${CF_ACCOUNT_ALT:-}}"
          if [[ -z "$token" ]]; then
            echo '::error::No Cloudflare API token is configured in repository Actions secrets (checked CLOUDFLARE_API_TOKEN and CF_API_TOKEN).'
            exit 2
          fi
          echo "CLOUDFLARE_API_TOKEN=$token" >> "$GITHUB_ENV"
          if [[ -n "$account" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          fi
          echo 'Cloudflare token is configured.'

      - name: Discover Pages project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CF_PROJECT_SECRET:-}" ]]; then
            project="$CF_PROJECT_SECRET"
          else
            npx --yes wrangler@4 pages project list > "$RUNNER_TEMP/pages-projects.txt"
            echo 'Available Pages projects:'
            sed -E 's/[A-Za-z0-9_-]{40,}/[REDACTED]/g' "$RUNNER_TEMP/pages-projects.txt"
            project="$(awk 'BEGIN{IGNORECASE=1} /invite2\.avocadoss\.co\.kr/ {gsub(/^[[:space:]│|]+|[[:space:]│|]+$/,""); split($0,a,/│|\|/); gsub(/^[[:space:]]+|[[:space:]]+$/,"",a[1]); print a[1]; exit}' "$RUNNER_TEMP/pages-projects.txt")"
            if [[ -z "$project" ]]; then
              project="$(awk 'BEGIN{IGNORECASE=1} /(^|[[:space:]│|])invite2([[:space:]│|]|$)/ {gsub(/^[[:space:]│|]+|[[:space:]│|]+$/,""); split($0,a,/│|\|/); gsub(/^[[:space:]]+|[[:space:]]+$/,"",a[1]); print a[1]; exit}' "$RUNNER_TEMP/pages-projects.txt")"
            fi
          fi
          if [[ -z "${project:-}" ]]; then
            echo '::error::Could not identify the Cloudflare Pages project for invite2.avocadoss.co.kr.'
            exit 3
          fi
          echo "CF_PAGES_PROJECT=$project" >> "$GITHUB_ENV"
          echo "Resolved Pages project: $project"

      - name: Build supplied collage photo assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p invite2/assets
          for name in left center right; do
            src="invite2/assets-src/collage-${name}.webp.b64"
            out="invite2/assets/collage-${name}.webp"
            test -s "$src"
            base64 --decode "$src" > "$out"
            size="$(wc -c < "$out")"
            [[ "$size" -gt 20000 ]] || { echo "::error::$out decoded too small: $size bytes"; exit 9; }
            magic="$(xxd -p -l 12 "$out")"
            [[ "$magic" == 52494646*57454250 ]] || { echo "::error::$out is not a valid RIFF/WEBP file"; exit 10; }
            echo "$out: $size bytes"
          done
          rm -rf invite2/assets-src

      - name: Validate invite2 source markers and asset paths
        shell: bash
        run: |
          set -euo pipefail
          test -f invite2/index.html
          test -f invite2/styles.css
          test -f invite2/invite2-hotfix.css
          test -f invite2/app.js
          test -s invite2/assets/collage-left.webp
          test -s invite2/assets/collage-center.webp
          test -s invite2/assets/collage-right.webp
          grep -F 'invitation-collage' invite2/index.html
          grep -F 'src="/assets/collage-left.webp' invite2/index.html
          grep -F 'src="/assets/collage-center.webp' invite2/index.html
          grep -F 'src="/assets/collage-right.webp' invite2/index.html
          grep -F '아들</span><strong>강호성' invite2/index.html
          grep -F '며느리</span><strong>홍주은' invite2/index.html
          grep -F '손녀</span><strong>강채원' invite2/index.html
          grep -E 'href="/styles\.css\?v=' invite2/index.html
          grep -E 'href="/invite2-hotfix\.css\?v=' invite2/index.html
          grep -E 'src="/app\.js\?v=' invite2/index.html
          if grep -Eq '(href|src)="\./(styles\.css|invite2-hotfix\.css|app\.js)' invite2/index.html; then
            echo '::error::Relative production asset path detected. Root domain redirects to /invite/... so assets must use absolute / paths.'
            exit 5
          fi

      - name: Deploy invite2 directory to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy invite2 \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

      - name: Verify production content and assets
        shell: bash
        run: |
          set -euo pipefail
          base='https://invite2.avocadoss.co.kr'
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsSL --max-time 20 "$base/?deploy_check=$GITHUB_SHA" || true)"
            if grep -q 'invitation-collage' <<<"$body" \
              && grep -q 'src="/assets/collage-left.webp' <<<"$body" \
              && grep -q 'src="/assets/collage-center.webp' <<<"$body" \
              && grep -q 'src="/assets/collage-right.webp' <<<"$body" \
              && ! grep -q '저희에게 찾아온 가장 빛나는 선물' <<<"$body" \
              && grep -q 'href="/styles.css?v=' <<<"$body" \
              && grep -q 'href="/invite2-hotfix.css?v=' <<<"$body" \
              && grep -q 'src="/app.js?v=' <<<"$body"; then
              echo "Production HTML verified on attempt $attempt"
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              echo '::error::Production HTML did not update to the expected collage-photo version.'
              exit 4
            fi
            echo "Production not updated yet; retry $attempt/6"
            sleep 10
          done

          css_type="$(curl -fsSI --max-time 20 "$base/styles.css?verify=$GITHUB_SHA" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print tolower($0); exit}')"
          hotfix_type="$(curl -fsSI --max-time 20 "$base/invite2-hotfix.css?verify=$GITHUB_SHA" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print tolower($0); exit}')"
          js_type="$(curl -fsSI --max-time 20 "$base/app.js?verify=$GITHUB_SHA" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print tolower($0); exit}')"
          [[ "$css_type" == *'text/css'* ]] || { echo "::error::styles.css MIME invalid: $css_type"; exit 6; }
          [[ "$hotfix_type" == *'text/css'* ]] || { echo "::error::invite2-hotfix.css MIME invalid: $hotfix_type"; exit 7; }
          [[ "$js_type" == *'javascript'* ]] || { echo "::error::app.js MIME invalid: $js_type"; exit 8; }

          for name in left center right; do
            image_headers="$(curl -fsSI --max-time 20 "$base/assets/collage-${name}.webp?verify=$GITHUB_SHA" | tr -d '\r')"
            image_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print tolower($0); exit}' <<<"$image_headers")"
            image_len="$(awk 'BEGIN{IGNORECASE=1} /^content-length:/ {gsub(/[^0-9]/, "", $0); print $0; exit}' <<<"$image_headers")"
            [[ "$image_type" == *'image/webp'* ]] || { echo "::error::collage-${name}.webp MIME invalid: $image_type"; exit 11; }
            if [[ -n "$image_len" ]]; then [[ "$image_len" -gt 20000 ]] || { echo "::error::collage-${name}.webp too small in production: $image_len"; exit 12; }; fi
          done
          echo '✅ invite2 production HTML, CSS/JS, and supplied WebP collage assets verified.'
