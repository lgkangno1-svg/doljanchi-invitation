name: Deploy to Mini PC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Test
        run: |
          pnpm check
          pnpm test

      - name: Build Docker image
        run: docker build -t doljanchi-invitation:latest .

      - name: Save Docker image as tar
        run: docker save doljanchi-invitation:latest | gzip > doljanchi-invitation.tar.gz

      - name: Copy image to Mini PC via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIPC_HOST }}
          username: ${{ secrets.MINIPC_USER }}
          key: ${{ secrets.MINIPC_SSH_KEY }}
          port: ${{ secrets.MINIPC_PORT || 22 }}
          source: "doljanchi-invitation.tar.gz,docker-compose.yml"
          target: "~/doljanchi-invitation"

      - name: Deploy on Mini PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIPC_HOST }}
          username: ${{ secrets.MINIPC_USER }}
          key: ${{ secrets.MINIPC_SSH_KEY }}
          port: ${{ secrets.MINIPC_PORT || 22 }}
          script: |
            cd ~/doljanchi-invitation
            docker load < doljanchi-invitation.tar.gz
            docker compose down
            docker compose up -d
            docker image prune -f
            echo "✅ Deploy complete"

