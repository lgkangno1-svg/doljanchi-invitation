name: Deploy Frozen Invitation

# PRODUCTION FREEZE
# The public invitation must stay pinned to the owner-approved commit below.
# Do not change FROZEN_INVITATION_SHA or re-enable push deployment unless the repository owner explicitly asks to unfreeze production.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-invitation-frozen
  cancel-in-progress: false

env:
  FROZEN_INVITATION_SHA: e1a25f6647d0d86de12808ecdfba07b2572a184a

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen production revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_INVITATION_SHA }}

      - name: Verify production revision is immutable
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FROZEN_INVITATION_SHA"
          echo "✅ Frozen invitation revision verified: $actual"

      - name: Verify owner-approved invitation media and controls
        run: |
          set -euo pipefail
          grep -F '20260903-mobile-hero-2' client/src/pages/Home.tsx
          grep -F '<img src={HERO_IMAGE} alt="채원의 첫 번째 생일을 위한 호텔 스타일 케이크 테이블"' client/src/pages/Home.tsx
          grep -F 'className="music-control"' client/src/pages/Home.tsx
          grep -F 'className="share-bar"' client/src/pages/Home.tsx
          grep -F 'preload="auto" loop' client/src/pages/Home.tsx
          grep -F '<source src={BGM} type="audio/mpeg" />' client/src/pages/Home.tsx
          grep -F 'Strauss%2C_An_der_sch%C3%B6nen_blauen_Donau' client/src/pages/Home.tsx
          grep -F 'normalizedKey' server/_core/storageProxy.ts
          grep -F 'path.resolve(import.meta.dirname, "public/manus-storage", normalizedKey)' server/_core/storageProxy.ts
          test -s client/public/manus-storage/invitations/1/1787323479492-chaewon-hotel-hero_a7c0aa2c.png
          if grep -F 'bottom-share-bar' client/src/pages/Home.tsx; then
            echo "::error::Broken legacy bottom-share-bar returned."
            exit 1
          fi
          if grep -F '<BgmGuide' client/src/pages/Home.tsx; then
            echo "::error::Broken legacy BgmGuide integration returned."
            exit 1
          fi
          echo "✅ Mobile hero cache-bust, fixed BGM control, nested storage routing, and Blue Danube BGM verified"

      - name: Restore Blue Danube invitation BGM
        run: |
          set -euo pipefail
          mkdir -p client/public/manus-storage
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 \
            "https://upload.wikimedia.org/wikipedia/commons/transcoded/9/91/Strauss%2C_An_der_sch%C3%B6nen_blauen_Donau.ogg/Strauss%2C_An_der_sch%C3%B6nen_blauen_Donau.ogg.mp3" \
            -o client/public/manus-storage/chaewon-first-birthday-bgm_af29a8dc.mp3
          test -s client/public/manus-storage/chaewon-first-birthday-bgm_af29a8dc.mp3
          echo "✅ Blue Danube BGM restored"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Critical frozen invitation tests
        run: >-
          pnpm exec vitest run
          server/bgm.test.ts
          server/bgmGuide.test.ts

      - name: Check Mini PC deployment configuration
        id: deploy_target
        env:
          MINIPC_HOST: ${{ secrets.MINIPC_HOST }}
          MINIPC_USER: ${{ secrets.MINIPC_USER }}
          MINIPC_SSH_KEY: ${{ secrets.MINIPC_SSH_KEY }}
        run: |
          if [ -n "$MINIPC_HOST" ] && [ -n "$MINIPC_USER" ] && [ -n "$MINIPC_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Validation passed; Mini PC credentials are not configured."
          fi

      - name: Build Docker image
        if: steps.deploy_target.outputs.ready == 'true'
        run: docker build -t doljanchi-invitation:latest .

      - name: Verify assets inside Docker image
        if: steps.deploy_target.outputs.ready == 'true'
        run: >-
          docker run --rm --entrypoint sh doljanchi-invitation:latest -c
          'test -s /app/dist/public/manus-storage/invitations/1/1787323479492-chaewon-hotel-hero_a7c0aa2c.png && test -s /app/dist/public/manus-storage/chaewon-first-birthday-bgm_af29a8dc.mp3'

      - name: Save Docker image as tar
        if: steps.deploy_target.outputs.ready == 'true'
        run: docker save doljanchi-invitation:latest | gzip > doljanchi-invitation.tar.gz

      - name: Copy image to Mini PC via SCP
        if: steps.deploy_target.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIPC_HOST }}
          username: ${{ secrets.MINIPC_USER }}
          key: ${{ secrets.MINIPC_SSH_KEY }}
          port: ${{ secrets.MINIPC_PORT || 22 }}
          source: "doljanchi-invitation.tar.gz,docker-compose.yml"
          target: "~/doljanchi-invitation"

      - name: Deploy on Mini PC via SSH
        if: steps.deploy_target.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIPC_HOST }}
          username: ${{ secrets.MINIPC_USER }}
          key: ${{ secrets.MINIPC_SSH_KEY }}
          port: ${{ secrets.MINIPC_PORT || 22 }}
          script: |
            cd ~/doljanchi-invitation
            docker load < doljanchi-invitation.tar.gz
            docker compose down
            docker compose up -d
            docker image prune -f
            echo "✅ Frozen invitation deploy complete"
