name: Deploy Frozen Invitation

# ONE-TIME VALIDATION TRIGGER. Remove push immediately after this run completes.
# Production source itself remains pinned to the owner-approved SHA below.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: deploy-invitation-frozen
  cancel-in-progress: false

env:
  FROZEN_INVITATION_SHA: fb901585f065adbe70210c45a7449c5aaa600a9a

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen production revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FROZEN_INVITATION_SHA }}

      - name: Verify production revision is immutable
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$FROZEN_INVITATION_SHA"
          echo "✅ Frozen invitation revision verified: $actual"

      - name: Verify owner-approved invitation media
        run: |
          set -euo pipefail
          grep -F '<img src={HERO_IMAGE} alt="채원의 첫 번째 생일을 위한 호텔 스타일 케이크 테이블"' client/src/pages/Home.tsx
          grep -F 'className="love-transition"><img src={HERO_IMAGE}' client/src/pages/Home.tsx
          grep -F '<source src={BGM} type="audio/mpeg" />' client/src/pages/Home.tsx
          grep -F '<source src={BGM_FALLBACK} type="audio/mpeg" />' client/src/pages/Home.tsx
          grep -F '카카오톡 공유' client/src/pages/Home.tsx
          if grep -F 'className="gallery-portrait"' client/src/pages/Home.tsx; then
            echo "::error::The later AI-added standalone gallery layout has returned."
            exit 1
          fi
          if grep -F 'galleryMedia.slice(2)' client/src/pages/Home.tsx; then
            echo "::error::The later AI-added memory strip has returned."
            exit 1
          fi
          echo "✅ Cake hero and resilient BGM configuration verified"

      - name: Restore invitation BGM
        run: |
          set -euo pipefail
          mkdir -p client/public/manus-storage
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 \
            "https://cdn.pixabay.com/download/audio/2024/02/27/audio_f76c4a5d60.mp3?filename=lorenzobuczek-breton-lullaby-berceuse-bretonne-193499.mp3" \
            -o client/public/manus-storage/chaewon-first-birthday-bgm_af29a8dc.mp3
          test -s client/public/manus-storage/chaewon-first-birthday-bgm_af29a8dc.mp3
          echo "✅ BGM restored"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Critical frozen invitation tests
        run: >-
          pnpm exec vitest run
          server/bgm.test.ts
          server/bgmGuide.test.ts

      - name: Check Mini PC deployment configuration
        id: deploy_target
        env:
          MINIPC_HOST: ${{ secrets.MINIPC_HOST }}
          MINIPC_USER: ${{ secrets.MINIPC_USER }}
          MINIPC_SSH_KEY: ${{ secrets.MINIPC_SSH_KEY }}
        run: |
          if [ -n "$MINIPC_HOST" ] && [ -n "$MINIPC_USER" ] && [ -n "$MINIPC_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "✅ Mini PC deployment credentials are configured"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Validation passed, but Mini PC deployment credentials are not configured. Skipping Docker build/deploy."
          fi

      - name: Build Docker image
        if: steps.deploy_target.outputs.ready == 'true'
        run: docker build -t doljanchi-invitation:latest .

      - name: Save Docker image as tar
        if: steps.deploy_target.outputs.ready == 'true'
        run: docker save doljanchi-invitation:latest | gzip > doljanchi-invitation.tar.gz

      - name: Copy image to Mini PC via SCP
        if: steps.deploy_target.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINIPC_HOST }}
          username: ${{ secrets.MINIPC_USER }}
          key: ${{ secrets.MINIPC_SSH_KEY }}
          port: ${{ secrets.MINIPC_PORT || 22 }}
          source: "doljanchi-invitation.tar.gz,docker-compose.yml"
          target: "~/doljanchi-invitation"

      - name: Deploy on Mini PC via SSH
        if: steps.deploy_target.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINIPC_HOST }}
          username: ${{ secrets.MINIPC_USER }}
          key: ${{ secrets.MINIPC_SSH_KEY }}
          port: ${{ secrets.MINIPC_PORT || 22 }}
          script: |
            cd ~/doljanchi-invitation
            docker load < doljanchi-invitation.tar.gz
            docker compose down
            docker compose up -d
            docker image prune -f
            echo "✅ Frozen invitation deploy complete"
