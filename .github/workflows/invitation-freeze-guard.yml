name: Invitation Freeze Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FROZEN_INVITATION_SHA: fb901585f065adbe70210c45a7449c5aaa600a9a

jobs:
  protect-live-invitation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject production invitation changes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN_INVITATION_SHA^{commit}"

          protected_paths=(
            client
            server
            shared
            drizzle
            package.json
            pnpm-lock.yaml
            tsconfig.json
            vite.config.ts
            vitest.config.ts
            Dockerfile
            docker-compose.yml
          )

          if ! git diff --quiet "$FROZEN_INVITATION_SHA" -- "${protected_paths[@]}"; then
            echo "::error::LIVE INVITATION IS FROZEN. Runtime/UI/media/deployment-source files differ from owner-approved commit $FROZEN_INVITATION_SHA."
            echo "Changed protected files:"
            git diff --name-only "$FROZEN_INVITATION_SHA" -- "${protected_paths[@]}"
            echo "Only an explicit owner request to modify invite.avocadoss.co.kr may authorize updating the frozen production SHA."
            exit 1
          fi

          # Mini PC deployment must stay pinned, restore the original cake blob explicitly,
          # and use the owner-approved luxury-hotel waltz instead of the temporary lullaby.
          grep -F 'FROZEN_SHA="fb901585f065adbe70210c45a7449c5aaa600a9a"' deploy.sh
          grep -F 'git archive "$FROZEN_SHA"' deploy.sh
          grep -F 'git show "$FROZEN_SHA:$HERO_REL"' deploy.sh
          grep -F 'BGM_URL="https://commons.wikimedia.org/wiki/Special:Redirect/file/Waltz_Op._69_no._1_in_A_flat_major.mp3"' deploy.sh
          grep -F 'Cake hero and BGM are publicly reachable' deploy.sh
          if grep -F 'git pull origin main' deploy.sh; then
            echo "::error::deploy.sh must never deploy mutable main."
            exit 1
          fi

          # GitHub deployment must stay manual-only and pinned to the same exact SHA.
          grep -F 'FROZEN_INVITATION_SHA: fb901585f065adbe70210c45a7449c5aaa600a9a' .github/workflows/deploy.yml
          grep -F 'Waltz_Op._69_no._1_in_A_flat_major.mp3' .github/workflows/deploy.yml
          grep -F 'workflow_dispatch:' .github/workflows/deploy.yml
          if grep -Eq '^[[:space:]]+push:' .github/workflows/deploy.yml; then
            echo "::error::Automatic push deployment is forbidden for the frozen invitation."
            exit 1
          fi

          echo "✅ Live invitation remains frozen with the original cake hero and approved hotel-waltz deployment path."
