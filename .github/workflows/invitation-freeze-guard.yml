name: Invitation Freeze Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FROZEN_INVITATION_SHA: e1a25f6647d0d86de12808ecdfba07b2572a184a

jobs:
  protect-live-invitation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject production invitation changes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN_INVITATION_SHA^{commit}"

          protected_paths=(
            client
            server
            shared
            drizzle
            package.json
            pnpm-lock.yaml
            tsconfig.json
            vite.config.ts
            vitest.config.ts
            Dockerfile
            docker-compose.yml
          )

          if ! git diff --quiet "$FROZEN_INVITATION_SHA" -- "${protected_paths[@]}"; then
            echo "::error::LIVE INVITATION IS FROZEN. Runtime/UI/media/deployment-source files differ from owner-approved commit $FROZEN_INVITATION_SHA."
            git diff --name-only "$FROZEN_INVITATION_SHA" -- "${protected_paths[@]}"
            exit 1
          fi

          grep -F 'FROZEN_SHA="e1a25f6647d0d86de12808ecdfba07b2572a184a"' deploy.sh
          grep -F 'git archive "$FROZEN_SHA"' deploy.sh
          grep -F 'git show "$FROZEN_SHA:$HERO_REL"' deploy.sh
          grep -F '20260903-mobile-hero-2' deploy.sh
          grep -F 'Mobile cake hero and Blue Danube BGM are publicly reachable' deploy.sh
          grep -F 'Strauss%2C_An_der_sch%C3%B6nen_blauen_Donau' deploy.sh
          if grep -F 'git pull origin main' deploy.sh; then
            echo "::error::deploy.sh must never deploy mutable main."
            exit 1
          fi

          grep -F 'FROZEN_INVITATION_SHA: e1a25f6647d0d86de12808ecdfba07b2572a184a' .github/workflows/deploy.yml
          grep -F 'workflow_dispatch:' .github/workflows/deploy.yml
          if grep -Eq '^[[:space:]]+push:' .github/workflows/deploy.yml; then
            echo "::error::Automatic push deployment is forbidden for the frozen invitation."
            exit 1
          fi

          grep -F 'path.resolve(import.meta.dirname, "public/manus-storage", normalizedKey)' server/_core/storageProxy.ts
          grep -F '20260903-mobile-hero-2' client/src/pages/Home.tsx
          grep -F 'className="music-control"' client/src/pages/Home.tsx
          grep -F 'className="share-bar"' client/src/pages/Home.tsx
          if grep -F 'bottom-share-bar' client/src/pages/Home.tsx; then
            echo "::error::Broken legacy bottom-share-bar returned."
            exit 1
          fi
          if grep -F '<BgmGuide' client/src/pages/Home.tsx; then
            echo "::error::Broken legacy BgmGuide integration returned."
            exit 1
          fi

          echo "✅ Live invitation remains frozen with mobile hero cache-bust, fixed BGM control, nested media routing, and Blue Danube BGM."
