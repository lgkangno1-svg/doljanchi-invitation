name: Invitation Freeze Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FROZEN_INVITATION_SHA: fa2cb01c456536715826b0424c3026dfb2ff3166

jobs:
  protect-live-invitation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject production invitation changes
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$FROZEN_INVITATION_SHA^{commit}"

          protected_paths=(
            client
            server
            shared
            drizzle
            package.json
            pnpm-lock.yaml
            tsconfig.json
            vite.config.ts
            vitest.config.ts
            Dockerfile
            docker-compose.yml
          )

          if ! git diff --quiet "$FROZEN_INVITATION_SHA" -- "${protected_paths[@]}"; then
            echo "::error::LIVE INVITATION IS FROZEN. Runtime/UI/media/deployment-source files differ from owner-approved commit $FROZEN_INVITATION_SHA."
            echo "Changed protected files:"
            git diff --name-only "$FROZEN_INVITATION_SHA" -- "${protected_paths[@]}"
            echo "Only an explicit owner request to modify invite.avocadoss.co.kr may authorize updating the frozen production SHA."
            exit 1
          fi

          # Mini PC deployment must stay pinned, restore the original cake blob explicitly,
          # and use the owner-approved public-domain Blue Danube waltz.
          grep -F 'FROZEN_SHA="fa2cb01c456536715826b0424c3026dfb2ff3166"' deploy.sh
          grep -F 'git archive "$FROZEN_SHA"' deploy.sh
          grep -F 'git show "$FROZEN_SHA:$HERO_REL"' deploy.sh
          grep -F 'Strauss%2C_An_der_sch%C3%B6nen_blauen_Donau' deploy.sh
          grep -F 'Cake hero and Blue Danube BGM are publicly reachable' deploy.sh
          if grep -F 'git pull origin main' deploy.sh; then
            echo "::error::deploy.sh must never deploy mutable main."
            exit 1
          fi

          # GitHub deployment must stay manual-only and pinned to the same exact SHA.
          grep -F 'FROZEN_INVITATION_SHA: fa2cb01c456536715826b0424c3026dfb2ff3166' .github/workflows/deploy.yml
          grep -F 'Strauss%2C_An_der_sch%C3%B6nen_blauen_Donau' .github/workflows/deploy.yml
          grep -F 'workflow_dispatch:' .github/workflows/deploy.yml
          if grep -Eq '^[[:space:]]+push:' .github/workflows/deploy.yml; then
            echo "::error::Automatic push deployment is forbidden for the frozen invitation."
            exit 1
          fi

          # The frozen runtime itself must retain the nested media-path fix and waltz fallback.
          grep -F 'path.resolve(import.meta.dirname, "public/manus-storage", normalizedKey)' server/_core/storageProxy.ts
          grep -F 'Strauss%2C_An_der_sch%C3%B6nen_blauen_Donau' client/src/pages/Home.tsx

          echo "✅ Live invitation remains frozen with nested cake media routing and the Blue Danube hotel-waltz BGM."
