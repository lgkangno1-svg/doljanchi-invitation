name: Probe extra Cloudflare credentials for insta-thread

on:
  push:
    branches:
      - ops/insta-thread-cloudflare-probe-20260909
    paths:
      - '.github/workflows/insta-thread-cloudflare-extra-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Presence only
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          CLOUDFLARED_TOKEN: ${{ secrets.CLOUDFLARED_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CLOUDFLARE_GLOBAL_API_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
        shell: bash
        run: |
          set -u
          for v in CF_API_TOKEN CLOUDFLARE_TUNNEL_TOKEN CF_TUNNEL_TOKEN TUNNEL_TOKEN CLOUDFLARED_TOKEN CLOUDFLARE_API_KEY CF_API_KEY CLOUDFLARE_GLOBAL_API_KEY CF_GLOBAL_API_KEY CLOUDFLARE_EMAIL CF_EMAIL; do
            if [[ -n "${!v:-}" ]]; then echo "$v=present"; else echo "$v=absent"; fi
          done
